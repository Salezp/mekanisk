<style>
/* Layout: workshop — pegboard stage on top, parts drawer below it, run controls last; one column everywhere */
:root{
  --bg:#0e1217; --panel:#151b22; --line:#27313c; --fg:#e7ecf1; --muted:#93a1af; --accent:#e8743b; --accent-ink:#1a0d06; --warn:#ff6b5e;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;

  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 28px}

.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

.mark{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.mark small{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--accent);letter-spacing:.08em}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:13px;padding:6px 12px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:min(62vh,640px);min-height:340px;background:#0d1117}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:10px;right:10px;top:10px;font-family:var(--f-mono);font-size:12.5px;color:var(--fg);pointer-events:none;display:flex;justify-content:space-between;gap:8px}
.hint span{background:color-mix(in srgb,var(--bg) 78%,transparent);padding:5px 9px;border-radius:5px}
.hint .warn{color:var(--warn)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.tool{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;border:1px solid var(--line);border-radius:8px;font-family:var(--f-display);font-weight:500;font-size:12.5px;letter-spacing:.02em;color:var(--muted);text-align:center;line-height:1.15}
.tool svg{width:30px;height:22px}
.tool[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.run{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctl{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:13px;padding:8px 13px;border:1px solid var(--line);border-radius:6px;color:var(--fg);white-space:nowrap}
.ctl.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:64px;text-align:center}
.ctl:focus-visible,.tool:focus-visible,.lang button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font-family:var(--f-mono);font-size:13px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;max-width:100%}
.speed{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:1;min-width:170px}

.help{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;max-width:70ch}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function drive(dt){

function solve(it){place();const byId=new Map(S.j.map(q=>[q.id,q]));
 for(let k=0;k<it;k++){for(const r of S.b){const a=byId.get(r.a),b=byId.get(r.b);if(!a||!b)continue;const wa=mov(a)?1:0,wb=mov(b)?1:0;if(!wa&&!wb)continue;
   const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6,c=(d-r.len)/d/(wa+wb);
   if(wa){a.x+=dx*c*wa;a.y+=dy*c*wa}if(wb){b.x-=dx*c*wb;b.y-=dy*c*wb}}
  for(const q of S.j)if(q.sl&&mov(q)){const t=(q.x-q.sl.ox)*q.sl.dx+(q.y-q.sl.oy)*q.sl.dy;q.x=q.sl.ox+t*q.sl.dx;q.y=q.sl.oy+t*q.sl.dy}}
 strain=0;for(const r of S.b){const a=byId.get(r.a),b=byId.get(r.b);if(!a||!b)continue;r.err=Math.abs(Math.hypot(b.x-a.x,b.y-a.y)-r.len)/Math.max(r.len,1);strain=Math.max(strain,r.err)}}

  if(w.motor&&w.kind==='gear'){const b=mesh(geo.cyl,M.motor);b.scale.set(6,4,6);b.rotation.x=Math.PI/2;b.position.z=10;g.add(b)}
  const ax=mesh(geo.cyl,M.pin);ax.scale.set(4.2,22,4.2);ax.rotation.x=Math.PI/2;ax.position.z=4;g.add(ax);
  g.position.set(w.x,w.y,0);objs.w.set(w.id,g)}
 for(const r of S.b){const m=mesh(geo.box,M.bar);m.scale.set(1,U*0.42,4);world.add(m);objs.b.set(r.id,m)}
 for(const q of S.j){const g=new THREE.Group();world.add(g);const top=ZL(2)+4;
  const p=mesh(geo.cyl,M.pin);p.scale.set(3.2,top,3.2);p.rotation.x=Math.PI/2;p.position.z=top/2;g.add(p);
  if(q.fixed&&!q.center){const br=mesh(geo.box,M.fix);br.scale.set(U*0.8,U*0.8,8);br.position.z=4;g.add(br)}
  if(q.sl){const rl=mesh(geo.box,M.rail);const ang=Math.atan2(q.sl.dy,q.sl.dx);rl.scale.set(U*12,5,4);rl.position.set(q.sl.ox,q.sl.oy,2);rl.rotation.z=ang;world.add(rl);
   const blk=mesh(geo.box,M.fix);blk.scale.set(U*0.9,U*0.6,6);blk.position.z=6;blk.rotation.z=ang;g.add(blk)}
  if(q.pen){const s=mesh(geo.sph,M.pen);s.scale.setScalar(5);s.position.z=top+2;g.add(s)}
  objs.j.set(q.id,g)}
 for(const id of [...traces.keys()])if(!S.j.some(q=>q.id===id&&q.pen)){sc.remove(traces.get(id).obj);traces.delete(id)}
 for(const q of S.j)if(q.pen&&!traces.has(q.id)){const n=900,arr=new Float32Array(n*3),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const o=new THREE.Points(g,new THREE.PointsMaterial({color:0xF2B53A,size:3.5}));o.frustumCulled=false;sc.add(o);traces.set(q.id,{obj:o,arr,g,c:0,n})}
 ghost=mesh(geo.sph,M.ghost);ghost.scale.setScalar(7);ghost.visible=false;world.add(ghost);built=S.n}
function sync(){if(built!==S.n)rebuild();
 for(const w of S.w){const g=objs.w.get(w.id);if(g)g.rotation.z=w.phi+w.off}
 for(const r of S.b){const m=objs.b.get(r.id),a=J(r.a),b=J(r.b);if(!m||!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y;m.scale.x=Math.hypot(dx,dy)+U*0.42;m.position.set((a.x+b.x)/2,(a.y+b.y)/2,ZL(r.layer));m.rotation.z=Math.atan2(dy,dx);m.material=r.err>0.03?M.barErr:M.bar}
 for(const q of S.j){const g=objs.j.get(q.id);if(g)g.position.set(q.x,q.y,0)}
 if(pending){const q=J(pending);if(q){ghost.visible=true;ghost.position.set(q.x,q.y,ZL(2)+8)}}else if(ghost)ghost.visible=false;
 document.getElementById('warn').hidden=strain<0.03}
function addTrace(){for(const q of S.j)if(q.pen){const t=traces.get(q.id);if(!t)continue;const z=ZL(2)+8;
 if(t.c<t.n){t.arr.set([q.x,q.y,z],t.c*3);t.c++}else{t.arr.copyWithin(0,3);t.arr.set([q.x,q.y,z],(t.n-1)*3)}t.g.attributes.position.needsUpdate=true;t.g.setDrawRange(0,t.c)}}
function clearTraces(){for(const t of traces.values()){t.c=0;t.g.setDrawRange(0,0)}}

// ---------------- input ----------------
const ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0),hit=new THREE.Vector3();
function boardPoint(cx,cy){const r=cv.getBoundingClientRect();ray.setFromCamera({x:(cx-r.left)/r.width*2-1,y:-(cy-r.top)/r.height*2+1},cam);
 if(!ray.ray.intersectPlane(plane,hit))return null;if(Math.abs(hit.x)>BW/2||Math.abs(hit.y)>BH/2)return null;return{x:hit.x,y:hit.y}}
function tap(cx,cy){const p=boardPoint(cx,cy);if(!p)return;const gx=snap(p.x),gy=snap(p.y);
 if(tool==='bar'){push();const q=jointAt(p.x,p.y,U*0.5)||getJoint(gx,gy);if(!pending){pending=q.id}else{const a=J(pending);if(a&&a.id!==q.id)addBar(a,q);pending=null}}
 else if(tool==='fix'){push();const q=jointAt(p.x,p.y,U*0.5)||jointAt(gx,gy);if(q&&!q.center&&!q.wh)q.fixed=!q.fixed;else if(!q)newJoint(gx,gy,{fixed:true})}
 else if(tool==='motor'){push();const w=wheelAt(p.x,p.y);if(w&&Math.hypot(w.x-p.x,w.y-p.y)<U*0.8){if(w.kind==='gear')w.motor=!w.motor;else w.dir*=-1}else if(!w&&!jointAt(gx,gy)){const m=addWheel(gx,gy,'motor');newJoint(gx+U,gy,{wh:{w:m.id,r:U,a:0}})}}
 else if(GZ[tool]){const hx=snap(p.x,true),hy=snap(p.y,true);if(!S.w.some(w=>Math.hypot(w.x-hx,w.y-hy)<U*0.6)){push();addWheel(hx,hy,'gear',GZ[tool])}}
 else if(tool==='sh'||tool==='sv'){push();let q=jointAt(p.x,p.y,U*0.5)||jointAt(gx,gy);if(!q)q=newJoint(gx,gy);if(!q.fixed&&!q.wh){q.sl=q.sl?null:{ox:q.x,oy:q.y,dx:tool==='sh'?1:0,dy:tool==='sh'?0:1}}}
 else if(tool==='pen'){const q=jointAt(p.x,p.y,U*0.6)||jointAt(gx,gy,U*0.6);if(q){push();q.pen=!q.pen}}
 else if(tool==='del'){push();const q=jointAt(p.x,p.y,U*0.45);if(q)removeJoint(q);else{const r=barAt(p.x,p.y);if(r)S.b=S.b.filter(o=>o!==r);else{const w=wheelAt(p.x,p.y);if(w)removeWheel(w)}}}
 S.n++;solve(40);save();hintUpdate()}
const ptrs=new Map();let down=null,pinch0=0,dist0=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1)down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};else{down=null;const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dist0=view.dist}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
 if(ptrs.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)down.moved=true;
  if(!down||down.moved){view.az+=dx*0.007;view.elev=Math.max(-0.3,Math.min(1.35,view.elev+dy*0.005))}}
 p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)view.dist=Math.max(250,Math.min(1800,dist0*pinch0/d))}});
const up=e=>{if(ptrs.size===1&&down&&!down.moved&&performance.now()-down.t<600)tap(e.clientX,e.clientY);ptrs.delete(e.pointerId);if(ptrs.size===0){down=null;pinch0=0}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);down=null;pinch0=0});
cv.addEventListener('wheel',e=>{e.preventDefault();view.dist=Math.max(250,Math.min(1800,view.dist*(1+e.deltaY*0.001)))},{passive:false});

// ---------------- examples ----------------
function ex(name){S=empty();pending=null;const g=v=>v*U;
 const mot=(x,y,px,py)=>{const m=addWheel(g(x),g(y),'motor');return newJoint(g(px),g(py),{wh:{w:m.id,r:Math.hypot(px-x,py-y)*U,a:Math.atan2(py-y,px-x)}})};
 const fx=(x,y)=>newJoint(g(x),g(y),{fixed:true}),fj=(x,y)=>newJoint(g(x),g(y));
 if(name==='four'){const p=mot(-5,-3,-4,-3),f=fx(3,-3),c=fj(-1,3),d=fj(3,2),k=fj(-3,6);addBar(p,c);addBar(c,d);addBar(d,f);addBar(p,k);addBar(c,k);k.pen=true}
 else if(name==='piston'){const p=mot(0,-5,2,-5),s=newJoint(0,g(3),{sl:{ox:0,oy:g(3),dx:0,dy:1}});addBar(p,s);const c=fj(0,6);c.sl={ox:0,oy:g(6),dx:0,dy:1};addBar(s,c)}
 else if(name==='gears'){const a=addWheel(g(-4.5),0,'gear',24,true);const b=addWheel(g(0.5),0,'gear',16);const c=addWheel(g(4),0,'gear',12);
  const pc=newJoint(g(4),g(1),{wh:{w:c.id,r:U,a:Math.PI/2}});const s=newJoint(g(4),g(6),{sl:{ox:g(4),oy:g(6),dx:0,dy:1}});addBar(pc,s);
  const pa=newJoint(g(-4.5),g(-2),{wh:{w:a.id,r:2*U,a:-Math.PI/2}});pa.pen=true}
 else if(name==='beest'){const sc_=0.1,ox=2,oy=4;const L=(th)=>{const ii=(p0,r0,p1,r1)=>{const dx=p1[0]-p0[0],dy=p1[1]-p0[1],d=Math.hypot(dx,dy),a=(r0*r0-r1*r1+d*d)/(2*d),h=Math.sqrt(Math.max(0,r0*r0-a*a)),mx=p0[0]+a*dx/d,my=p0[1]+a*dy/d;return[[mx+h*dy/d,my-h*dx/d],[mx-h*dy/d,my+h*dx/d]]};
   const B=[-38,-7.8],A=[15*Math.cos(th),15*Math.sin(th)];let s=ii(A,50,B,41.5);const C=s[0][1]>s[1][1]?s[0]:s[1];s=ii(A,61.9,B,39.3);const D=s[0][1]<s[1][1]?s[0]:s[1];
   s=ii(B,40.1,C,55.8);const E=s[0][0]<s[1][0]?s[0]:s[1];s=ii(D,36.7,E,39.4);const F=s[0][0]<s[1][0]?s[0]:s[1];s=ii(D,49,F,65.7);const G=s[0][1]<s[1][1]?s[0]:s[1];return{A,B,C,D,E,F,G}};
  const P=L(0),w=v=>[(v[0]*sc_+ox)*U,(v[1]*sc_+oy)*U];const m=addWheel(ox*U,oy*U,'motor');
  const A=newJoint(...w(P.A),{wh:{w:m.id,r:1.5*U,a:0}}),B=newJoint(...w(P.B),{fixed:true});const N={};['C','D','E','F','G'].forEach(k=>N[k]=newJoint(...w(P[k])));
  [[A,N.C],[B,N.C],[A,N.D],[B,N.D],[B,N.E],[N.C,N.E],[N.D,N.F],[N.E,N.F],[N.D,N.G],[N.F,N.G]].forEach(([a,b])=>addBar(a,b));N.G.pen=true}
 clearTraces();built=-1;solve(40);save()}

// ---------------- UI ----------------
const toolsEl=document.getElementById('tools');
TOOLS.forEach(k=>{const b=document.createElement('button');b.className='tool';b.dataset.k=k;b.innerHTML=(GZ[k]?ICON.g(k==='g12'?5:k==='g16'?7:9):ICON[k])+`<span></span>`;
 b.onclick=()=>{tool=k;pending=null;paintTools();hintUpdate()};toolsEl.appendChild(b)});

function texts(){const t=T[lang];paintTools();hintUpdate();document.getElementById('play').textContent=running?t.stop:t.play;document.getElementById('undo').textContent=t.undo;
 document.getElementById('clear').textContent=t.clear;document.getElementById('sp-l').textContent=t.speed;document.getElementById('warn').textContent=t.warn;document.getElementById('help').innerHTML=t.help;
 const sel=document.getElementById('ex');sel.innerHTML=`<option value="">${t.ex}</option>`+Object.keys(t.exs).map(k=>`<option value="${k}">${t.exs[k]}</option>`).join('');
 document.getElementById('l-sv').setAttribute('aria-pressed',lang==='sv');document.getElementById('l-es').setAttribute('aria-pressed',lang==='es');document.documentElement.lang=lang}
document.getElementById('l-sv').onclick=()=>{lang='sv';texts()};document.getElementById('l-es').onclick=()=>{lang='es';texts()};
document.getElementById('play').onclick=()=>{running=!running;texts()};
document.getElementById('undo').onclick=()=>{if(!hist.length)return;S=JSON.parse(hist.pop());pending=null;built=-1;clearTraces();solve(40);save()};

document.getElementById('speed').oninput=e=>{speed=+e.target.value;document.getElementById('sp-o').textContent=speed.toFixed(1)+'×'};
if((location.hash||'').includes('es'))lang='es';

// ---------------- start ----------------
try{const s=localStorage.getItem('mekanisk-verkstad-1');if(s){S=JSON.parse(s);if(!S.j||!S.n)throw 0}}catch(e){S=null}
if(!S||!S.j.length)ex('four');
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){speed=0.5;document.getElementById('speed').value=0.5;document.getElementById('sp-o').textContent='0.5×'}
sizeR();texts();
let last=performance.now(),acc=0;
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(running&&!document.hidden){const n=3;for(let i=0;i<n;i++){drive(dt/n);solve(25)}addTrace()}else solve(5);
 sync();const c=Math.cos(view.elev);cam.position.set(view.dist*c*Math.cos(view.az),30+view.dist*Math.sin(view.elev),view.dist*c*Math.sin(view.az));cam.lookAt(0,20,0);
 R.render(sc,cam);requestAnimationFrame(loop)}
